                    <div class="flex justify-between items-start gap-2">
                        <h3 class="font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-100 leading-relaxed">
                            <span class="text-primary font-bold mr-1">${q.id}.</span> ${q.question}
                        </h3>
                    </div>
                `;

                htmlContent += `<div class="space-y-1.5 pt-1">`;
                q.options.forEach((opt, optIndex) => {
                    let isCorrect = (optIndex === q.correct);
                    let optionStyle = "bg-slate-50 dark:bg-slate-900/50 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300";
                    
                    if (isCorrect) {
                        optionStyle = "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-700 text-emerald-800 dark:text-emerald-200 font-semibold";
                    }

                    const letters = ["ক", "খ", "গ", "ঘ"];

                    htmlContent += `
                        <div class="p-2.5 rounded-xl border text-xs flex items-center justify-between ${optionStyle}">
                            <span class="flex items-center gap-2">
                                <span class="w-5 h-5 rounded-md bg-slate-200 dark:bg-slate-700 text-[10px] font-bold flex items-center justify-center">${letters[optIndex]}</span>
                                ${opt}
                            </span>
                            ${isCorrect ? '<span class="text-emerald-600 dark:text-emerald-400 font-bold text-xs">✔ সঠিক</span>' : ''}
                        </div>
                    `;
                });
                htmlContent += `</div>`;

                htmlContent += `
                    <div class="pt-1">
                        <button onclick="toggleExplanation(${q.id})" id="btn-exp-${q.id}" class="text-[11px] bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-medium transition shadow-sm">
                            ব্যাখ্যা দেখুন
                        </button>
                        <div id="exp-${q.id}" class="hidden mt-2 p-3 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 rounded-xl text-[11px] text-emerald-900 dark:text-emerald-200 leading-relaxed">
                            <strong>ব্যাখ্যা:</strong> ${q.explanation}
                        </div>
                    </div>
                `;

                card.innerHTML = htmlContent;
                container.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-3 py-1.5 rounded-lg font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 whitespace-nowrap transition";
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            if(activeBtn) {
                activeBtn.className = "cat-btn px-3 py-1.5 rounded-lg font-semibold bg-primary text-white whitespace-nowrap transition shadow-sm";
            }
            filterQuestions();
        }

        function filterQuestions() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = banglaQuestions;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(q => q.cat === currentCategory);
            }

            if (query.trim() !== '') {
                filtered = filtered.filter(q => 
                    q.question.toLowerCase().includes(query) || 
                    q.explanation.toLowerCase().includes(query) ||
                    q.options.some(opt => opt.toLowerCase().includes(query))
                );
            }

            renderQuestions(filtered);
        }

        function toggleExplanation(id) {
            const expDiv = document.getElementById(`exp-${id}`);
            const btn = document.getElementById(`btn-exp-${id}`);
            if (expDiv.classList.contains('hidden')) {
                expDiv.classList.remove('hidden');
                btn.textContent = "ব্যাখ্যা লুকান";
                btn.className = "text-[11px] bg-slate-600 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg font-medium transition shadow-sm";
            } else {
                expDiv.classList.add('hidden');
                btn.textContent = "ব্যাখ্যা দেখুন";
                btn.className = "text-[11px] bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-medium transition shadow-sm";
            }
        }

        // Scroll to top functionality
        window.addEventListener('scroll', () => {
            const topBtn = document.getElementById('topBtn');
            if (window.scrollY > 300) {
                topBtn.classList.remove('opacity-0', 'pointer-events-none');
                topBtn.classList.add('opacity-100');
            } else {
                topBtn.classList.add('opacity-0', 'pointer-events-none');
                topBtn.classList.remove('opacity-100');
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initial render
        renderQuestions(banglaQuestions);
    </script>

</body>
</html>
