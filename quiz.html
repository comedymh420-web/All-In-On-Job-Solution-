<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Master - All In One Job Solution</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e40af',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <!-- Top Header Bar -->
    <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md shadow-sm border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-primary dark:text-blue-400 font-bold text-sm flex items-center space-x-1">
                <span>← হোম পেজ</span>
            </a>
            <h1 class="text-base font-bold text-slate-800 dark:text-slate-100">Quiz Master</h1>
            <div class="w-12"></div>
        </div>
    </header>

    <!-- Main Container (Mobile Frame Fit) -->
    <main class="max-w-md w-full mx-auto p-4 my-auto">
        <!-- Bright-TechBD Quiz Component -->
        <div class="bt-quiz" data-duration="15">
          <style>
            .bt-quiz {
              --btq-primary: #2563eb;
              --btq-border: #e2e8f0;
              font-family: 'Hind Siliguri', sans-serif;
              color: #1e293b;
              width: 100%;
              box-sizing: border-box;
              font-size: 15px;
              line-height: 1.6;
            }
            .bt-quiz *,
            .bt-quiz *::before,
            .bt-quiz *::after {
              box-sizing: border-box;
            }
            .bt-quiz .btq-panel {
              background: #ffffff;
              border: 1px solid var(--btq-border);
              border-radius: 20px;
              padding: 20px;
              box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            }
            .dark .bt-quiz .btq-panel {
              background: #1e293b;
              border-color: #334155;
              color: #f8fafc;
            }
            .bt-quiz .btq-top,
            .bt-quiz .btq-footer,
            .bt-quiz .btq-meta {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 10px;
              flex-wrap: wrap;
            }
            .bt-quiz .btq-brand {
              color: var(--btq-primary);
              font-size: 18px;
              font-weight: 700;
              margin: 0;
            }
            .bt-quiz .btq-timer {
              background: #eff6ff;
              color: var(--btq-primary);
              border-radius: 10px;
              padding: 6px 12px;
              font-weight: 700;
              font-variant-numeric: tabular-nums;
              white-space: nowrap;
            }
            .dark .bt-quiz .btq-timer {
              background: #1e3a8a;
              color: #93c5fd;
            }
            .bt-quiz .btq-timer.btq-warning {
              background: #fef2f2;
              color: #dc2626;
            }
            .bt-quiz .btq-progress {
              height: 8px;
              width: 100%;
              margin: 16px 0 10px 0;
              background: #f1f5f9;
              border-radius: 20px;
              overflow: hidden;
            }
            .dark .bt-quiz .btq-progress {
              background: #334155;
            }
            .bt-quiz .btq-progress-fill {
              height: 100%;
              width: 0;
              background: var(--btq-primary);
              border-radius: inherit;
              transition: width .2s ease;
            }
            .bt-quiz .btq-meta {
              color: #64748b;
              font-size: 13px;
              margin-bottom: 12px;
            }
            .dark .bt-quiz .btq-meta {
              color: #94a3b8;
            }
            .bt-quiz .btq-question {
              font-size: 17px;
              line-height: 1.6;
              font-weight: 700;
              margin: 8px 0 16px;
              color: #1e293b;
            }
            .dark .bt-quiz .btq-question {
              color: #f8fafc;
            }
            .bt-quiz .btq-options {
              display: grid;
              grid-template-columns: 1fr;
              gap: 10px;
            }
            .bt-quiz .btq-option {
              display: flex;
              align-items: flex-start;
              gap: 12px;
              width: 100%;
              text-align: left;
              font: inherit;
              color: #334155;
              background: #ffffff;
              border: 1.5px solid var(--btq-border);
              border-radius: 12px;
              padding: 12px 14px;
              cursor: pointer;
              transition: all 0.15s ease;
            }
            .dark .bt-quiz .btq-option {
              background: #0f172a;
              border-color: #334155;
              color: #e2e8f0;
            }
            .bt-quiz .btq-option:hover {
              border-color: var(--btq-primary);
              background: #f8fafc;
            }
            .dark .bt-quiz .btq-option:hover {
              background: #1e293b;
            }
            .bt-quiz .btq-option.btq-selected {
              border-color: var(--btq-primary);
              background: #eff6ff;
              color: #1d4ed8;
              font-weight: 600;
            }
            .dark .bt-quiz .btq-option.btq-selected {
              background: #172554;
              color: #93c5fd;
            }
            .bt-quiz .btq-letter {
              display: inline-flex;
              flex: 0 0 26px;
              width: 26px;
              height: 26px;
              align-items: center;
              justify-content: center;
              background: #f1f5f9;
              border-radius: 6px;
              font-size: 12px;
              font-weight: 700;
              color: #475569;
            }
            .dark .bt-quiz .btq-letter {
              background: #334155;
              color: #cbd5e1;
            }
            .bt-quiz .btq-selected .btq-letter {
              color: #fff;
              background: var(--btq-primary);
            }
            .bt-quiz .btq-footer {
              margin-top: 20px;
            }
            .bt-quiz .btq-btn {
              display: inline-flex;
              justify-content: center;
              align-items: center;
              gap: 6px;
              min-height: 42px;
              padding: 10px 16px;
              border: 1.5px solid var(--btq-primary);
              border-radius: 10px;
              background: #ffffff;
              color: var(--btq-primary);
              font: inherit;
              font-weight: 600;
              cursor: pointer;
              transition: opacity 0.15s;
            }
            .dark .bt-quiz .btq-btn {
              background: #1e293b;
            }
            .bt-quiz .btq-btn-primary {
              color: #ffffff;
              background: var(--btq-primary);
            }
            .bt-quiz .btq-btn:disabled {
              opacity: .4;
              cursor: not-allowed;
            }
            .bt-quiz .btq-result {
              margin-top: 16px;
              padding: 18px;
              border-radius: 14px;
              background: #f8fafc;
              border: 1px solid var(--btq-border);
            }
            .dark .bt-quiz .btq-result {
              background: #0f172a;
              border-color: #334155;
            }
            .bt-quiz .btq-result h3 {
              margin: 0 0 6px;
              font-size: 18px;
              color: var(--btq-primary);
            }
            .bt-quiz .btq-score {
              font-size: 28px;
              font-weight: 700;
              margin: 4px 0 10px;
            }
            .bt-quiz .btq-stats {
              display: grid;
              grid-template-columns: repeat(3, 1fr);
              gap: 8px;
              margin-top: 12px;
            }
            .bt-quiz .btq-stat {
              padding: 8px 4px;
              background: #ffffff;
              border: 1px solid var(--btq-border);
              border-radius: 8px;
              text-align: center;
            }
            .dark .bt-quiz .btq-stat {
              background: #1e293b;
              border-color: #334155;
            }
            .bt-quiz .btq-stat strong {
              display: block;
              font-size: 18px;
            }
            .bt-quiz .btq-stat span {
              display: block;
              font-size: 11px;
              color: #64748b;
            }
            .bt-quiz .btq-hidden {
              display: none !important;
            }
            .bt-quiz .btq-note {
              margin: 14px 0 0;
              font-size: 12px;
              color: #64748b;
              text-align: center;
            }
            .set-btn.active {
              background-color: #2563eb;
              color: #ffffff;
              border-color: #2563eb;
            }
          </style>

          <div class="btq-panel">
            <div class="btq-top">
              <h2 class="btq-brand">চাকরির প্রস্তুতি কুইজ</h2>
              <div class="btq-timer" aria-live="off">
                ⏱ <span class="btq-time">15:00</span>
              </div>
            </div>

            <!-- Quiz Set Switcher Buttons -->
            <div class="mt-3 flex justify-center gap-1.5 text-xs font-semibold">
                <button type="button" onclick="switchQuizSet('auto')" id="btn-auto" class="set-btn active px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600">আজকের সেট</button>
                <button type="button" onclick="switchQuizSet('set1')" id="btn-set1" class="set-btn px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600">সেট ১</button>
                <button type="button" onclick="switchQuizSet('set2')" id="btn-set2" class="set-btn px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600">সেট ২</button>
                <button type="button" onclick="switchQuizSet('set3')" id="btn-set3" class="set-btn px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600">সেট ৩</button>
            </div>

            <div class="btq-progress" role="progressbar"
                 aria-label="প্রশ্নের অগ্রগতি"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="btq-progress-fill"></div>
            </div>

            <div class="btq-meta">
              <span class="btq-count">প্রশ্ন ১ / ১০০</span>
              <span class="btq-answered">উত্তর: ০</span>
            </div>

            <div class="btq-play">
              <div class="btq-question" tabindex="-1"></div>
              <div class="btq-options"></div>

              <div class="btq-footer">
                <button type="button" class="btq-btn btq-prev">← পূর্ববর্তী</button>
                <button type="button" class="btq-btn btq-next btq-btn-primary">পরবর্তী →</button>
                <button type="button" class="btq-btn btq-submit btq-btn-primary hidden">পরীক্ষা জমা দিন</button>
              </div>
              <p class="btq-note">প্রতিটি প্রশ্নে একটি উত্তর নির্বাচন করুন।</p>
            </div>

            <div class="btq-result btq-hidden" aria-live="polite">
              <h3>আপনার পরীক্ষার ফলাফল</h3>
              <div class="btq-score">০ / ১০০</div>
              <p class="btq-message"></p>
              <div class="btq-stats">
                <div class="btq-stat"><strong class="btq-correct text-emerald-600">০</strong><span>সঠিক</span></div>
                <div class="btq-stat"><strong class="btq-wrong text-rose-600">০</strong><span>ভুল</span></div>
                <div class="btq-stat"><strong class="btq-unanswered text-amber-600">০</strong><span>বাকি</span></div>
              </div>
              <div class="flex gap-2 mt-4">
                <button type="button" class="btq-btn flex-1 text-xs">উত্তরগুলো দেখুন</button>
                <button type="button" class="btq-btn btq-restart flex-1 text-xs">আবার পরীক্ষা দিন</button>
              </div>
            </div>

            <div class="btq-review-area btq-hidden mt-4 space-y-3"></div>
          </div>

          <script>
          var switchQuizSet; // Global Reference

          (function () {
            "use strict";
            var script = document.currentScript;
            var root = script && script.closest(".bt-quiz");
            if (!root || root.dataset.btqReady === "1") return;
            root.dataset.btqReady = "1";

            // একাধিক কুইজ সেটের ডেটাবেস
            var quizDatabase = {
              set1: [
                { question: "ড্রাই আইস (Dry Ice) বা শুষ্ক বরফ আসলে কী?", options: ["তরল নাইট্রোজেন", "কঠিন কার্বন ডাই-অক্সাইড", "কঠিন অক্সিজেন", "তরল হিলিয়াম"], answer: 1 },
                { question: "ভিটামিন সি-এর রাসায়নিক নাম কী?", options: ["রেটিনল", "থায়ামিন", "ক্যালসিফেরল", "অ্যাস্কারবিক এসিড"], answer: 3 },
                { question: "আন্তর্জাতিক মাতৃভাষা দিবস হিসেবে ২১শে ফেব্রুয়ারিকে ইউনেস্কো কত সালে স্বীকৃতি দেয়?", options: ["১৯৯৫ সালে", "১৯৯৭ সালে", "১৯৯৯ সালে", "২০০০ সালে"], answer: 2 },
                { question: "বাংলাদেশের সংবিধান কবে কার্যকর হয়?", options: ["২৬ মার্চ ১৯৭১", "১৬ ডিসেম্বর ১৯৭১", "২৬ মার্চ ১৯৭২", "১৬ ডিসেম্বর ১৯৭২"], answer: 3 },
                { question: "স্বাধীন বাংলাদেশের প্রথম রাষ্ট্রপতি কে ছিলেন?", options: ["বঙ্গবন্ধু শেখ মুজিবুর রহমান", "সৈয়দ নজরুল ইসলাম", "তাজউদ্দীন আহমদ", "এম মনসুর আলী"], answer: 0 },
                { question: "গ্রিনিচ মান সময়ের সাথে বাংলাদেশ সময়ের পার্থক্য কত?", options: ["+৫ ঘণ্টা", "+৬ ঘণ্টা", "-৫ ঘণ্টা", "-৬ ঘণ্টা"], answer: 1 },
                { question: "আয়তনে বাংলাদেশের সবচেয়ে বড় জেলা কোনটি?", options: ["সুন্দরবন", "রাঙ্গামাটি", "কক্সবাজার", "ময়মনসিংহ"], answer: 1 },
                { question: "পৃথিবীর দীর্ঘতম সমুদ্র সৈকত কোথায় অবস্থিত?", options: ["কুয়াকাটা", "সেন্টমার্টিন", "কক্সবাজার", "পতেঙ্গা"], answer: 2 },
                { question: "বাংলা গদ্যের জনক কে?", options: ["রবীন্দ্রনাথ ঠাকুর", "প্রমথ চৌধুরী", "ঈশ্বরচন্দ্র বিদ্যাসাগর", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়"], answer: 2 },
                { question: "রবীন্দ্রনাথ ঠাকুর কত সালে নোবেল পুরস্কার লাভ করেন?", options: ["১৯১০ সালে", "১৯১১ সালে", "১৯১৩ সালে", "১৯১৫ সালে"], answer: 2 }
              ],
              set2: [
                { question: "মানুষের শরীরে মোট হাড়ের সংখ্যা কয়টি?", options: ["২০৬টি", "২০৮টি", "৩১২টি", "১৪২টি"], answer: 0 },
                { question: "লোহিত রক্ত কণিকার আয়ুষ্কাল কত দিন?", options: ["২০ দিন", "৬০ দিন", "৯০ দিন", "১২০ দিন"], answer: 3 },
                { question: "বৈদ্যুতিক বাল্বের ফিলামেন্ট কী দিয়ে তৈরি?", options: ["তামা", "লোহা", "টাংস্টেন", "অ্যালুমিনিয়াম"], answer: 2 },
                { question: "'SIM' কার্ডের পূর্ণরূপ কী?", options: ["Subscriber Identity Module", "System Identity Memory", "Secure Internet Mobile", "Simple Identity Mode"], answer: 0 },
                { question: "বিশ্ব পরিবেশ দিবস কবে পালিত হয়?", options: ["১ মে", "৫ জুন", "৭ এপ্রিল", "১ ডিসেম্বর"], answer: 1 },
                { question: "জাতিসংঘের বর্তমান সদস্য সংখ্যা কত?", options: ["১৯১টি", "১৯২টি", "১৯৩টি", "১৯৫টি"], answer: 2 },
                { question: "ইন্টারপোলের (INTERPOL) সদর দপ্তর কোথায় অবস্থিত?", options: ["লন্ডন, যুক্তরাজ্য", "লিওঁ, ফ্রান্স", "নিউইয়র্ক, যুক্তরাষ্ট্র", "জেনেভা, সুইজারল্যান্ড"], answer: 1 },
                { question: "ন্যাটোর (NATO) সদর দপ্তর কোথায়?", options: ["ওয়াশিংটন", "প্যারিস", "ব্রাসেলস", "বার্লিন"], answer: 2 },
                { question: "বিশ্বব্যাংকের সদর দপ্তর কোথায় অবস্থিত?", options: ["নিউইয়র্ক", "ওয়াশিংটন ডি.সি.", "জেনেভা", "রোম"], answer: 1 },
                { question: "'অহি-নকুল' বাগধারার অর্থ কী?", options: ["তীব্র শত্রুতা", "পরম মিত্রতা", "অসম্ভব বস্তু", "সামান্য বিষয়"], answer: 0 }
              ],
              set3: [
                { question: "বাংলাদেশের জাতীয় ফুল কোনটি?", options: ["গোলাপ", "শাপলা", "জবা", "কদম"], answer: 1 },
                { question: "কাগজের প্রধান কাঁচামাল কী?", options: ["খড়", "বাঁশ", "কাঠ", "তুলা"], answer: 1 },
                { question: "কম্পিউটারের মস্তিষ্ক বলা হয় কোন অংশকে?", options: ["RAM", "Hard Disk", "CPU", "Monitor"], answer: 2 },
                { question: "পেনিসিলিন কে আবিষ্কার করেন?", options: ["আলেকজান্ডার ফ্লেমিং", "লুই পাস্তুর", "এডওয়ার্ড জেনার", "রবার্ট হুক"], answer: 0 },
                { question: "পানিপথের প্রথম যুদ্ধ কত সালে সংঘটিত হয়?", options: ["১৫২৬ সালে", "১৫৫৬ সালে", "১৭৫৭ সালে", "১৭৬১ সালে"], answer: 0 },
                { question: "'কবর' কবিতাটি কার রচনা?", options: ["কাজী নজরুল ইসলাম", "জসীমউদ্দীন", "জীবনানন্দ দাশ", "ফররুখ আহমদ"], answer: 1 },
                { question: "রক্ত জমাট বাঁধতে সাহায্য করে কোন কণিকা?", options: ["লোহিত কণিকা", "শ্বেত কণিকা", "অণুচক্রিকা", "রক্তরস"], answer: 2 },
                { question: "গ্রিনহাউস গ্যাসের প্রধান উপাদান কোনটি?", options: ["নাইট্রোজেন ডাই অক্সাইড", "কার্বন ডাই অক্সাইড", "মিথেন", "সিএফসি"], answer: 1 },
                { question: "পৃথিবীর বৃহত্তম মহাসাগর কোনটি?", options: ["আটলান্টিক মহাসাগর", "ভারত মহাসাগর", "প্রশান্ত মহাসাগর", "উত্তর মহাসাগর"], answer: 2 },
                { question: "'অপলাপ' শব্দের অর্থ কী?", options: ["মিথ্যা বলা", "অস্বীকার করা", "অতিরিক্ত কথা", "প্রশংসা করা"], answer: 1 }
              ]
            };

            // আজকের তারিখ অনুযায়ী অটোমেটিক সেট বেছে নেওয়া
            function getAutoSetKey() {
              var day = new Date().getDate();
              var keys = ["set1", "set2", "set3"];
              return keys[day % keys.length];
            }

            var currentSetKey = 'auto';
            var questions = quizDatabase[getAutoSetKey()];

            var letters = ["ক", "খ", "গ", "ঘ"];
            var duration = parseInt(root.getAttribute("data-duration"), 10);
            if (!Number.isFinite(duration) || duration < 1) duration = 15;

            var index = 0;
            var answers = new Array(questions.length).fill(null);
            var seconds = duration * 60;
            var timer = null;
            var submitted = false;
            var started = false;

            var $ = function (selector) { return root.querySelector(selector); };

            var play = $(".btq-play");
            var result = $(".btq-result");
            var reviewArea = $(".btq-review-area");
            var timeDisplay = $(".btq-time");
            var timerBox = $(".btq-timer");
            var questionBox = $(".btq-question");
            var optionsBox = $(".btq-options");
            var prevBtn = $(".btq-prev");
            var nextBtn = $(".btq-next");
            var submitBtn = $(".btq-submit");
            var progress = $(".btq-progress");
            var progressFill = $(".btq-progress-fill");

            function renderTime() {
              var m = Math.floor(seconds / 60);
              var s = seconds % 60;
              timeDisplay.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
              timerBox.classList.toggle("btq-warning", seconds <= 60);
            }

            function countAnswered() {
              return answers.filter(function (v) { return v !== null; }).length;
            }

            function renderQuestion() {
              var q = questions[index];
              $(".btq-count").textContent = "প্রশ্ন " + (index + 1) + " / " + questions.length;
              $(".btq-answered").textContent = "উত্তর: " + countAnswered();
              questionBox.textContent = q.question;
              optionsBox.replaceChildren();

              q.options.forEach(function (option, i) {
                var button = document.createElement("button");
                button.type = "button";
                button.className = "btq-option";
                if (answers[index] === i) button.classList.add("btq-selected");

                var letter = document.createElement("span");
                letter.className = "btq-letter";
                letter.textContent = letters[i] || String(i + 1);

                var text = document.createElement("span");
                text.textContent = option;

                button.append(letter, text);
                button.addEventListener("click", function () {
                  if (submitted) return;
                  answers[index] = i;
                  renderQuestion();
                  startTimer();
                });
                optionsBox.appendChild(button);
              });

              prevBtn.disabled = index === 0;
              if (index === questions.length - 1) {
                nextBtn.classList.add("hidden");
                submitBtn.classList.remove("hidden");
              } else {
                nextBtn.classList.remove("hidden");
                submitBtn.classList.add("hidden");
              }

              progressFill.style.width = (((index + 1) / questions.length) * 100) + "%";
            }

            function startTimer() {
              if (started || submitted) return;
              started = true;
              timer = setInterval(function () {
                seconds--;
                renderTime();
                if (seconds <= 0) {
                  seconds = 0;
                  renderTime();
                  finishQuiz(true);
                }
              }, 1000);
            }

            function finishQuiz(timeUp) {
              if (submitted) return;
              submitted = true;
              if (timer !== null) clearInterval(timer);
              if (timeUp) seconds = 0;
              renderTime();

              var correct = 0, wrong = 0, unanswered = 0;
              questions.forEach(function (q, i) {
                if (answers[i] === null) unanswered++;
                else if (answers[i] === q.answer) correct++;
                else wrong++;
              });

              $(".btq-score").textContent = correct + " / " + questions.length;
              $(".btq-correct").textContent = correct;
              $(".btq-wrong").textContent = wrong;
              $(".btq-unanswered").textContent = unanswered;
              $(".btq-message").textContent = (timeUp ? "সময় শেষ। " : "পরীক্ষা জমা হয়েছে। ") + correct + "টি সঠিক হয়েছে।";

              play.classList.add("btq-hidden");
              result.classList.remove("btq-hidden");
            }

            // সেট পরিবর্তন করার পাবলিক ফাংশন
            switchQuizSet = function (setKey) {
              if (timer !== null) clearInterval(timer);
              currentSetKey = setKey;

              var targetKey = (setKey === 'auto') ? getAutoSetKey() : setKey;
              questions = quizDatabase[targetKey];

              // বাটন অ্যাক্টিভ স্টাইল চেঞ্জ
              document.querySelectorAll('.set-btn').forEach(function(b) { b.classList.remove('active'); });
              var activeBtn = document.getElementById('btn-' + setKey);
              if (activeBtn) activeBtn.classList.add('active');

              index = 0;
              answers = new Array(questions.length).fill(null);
              seconds = duration * 60;
              submitted = false;
              started = false;
              timer = null;

              renderTime();
              renderQuestion();
              reviewArea.replaceChildren();
              reviewArea.classList.add("btq-hidden");
              result.classList.add("btq-hidden");
              play.classList.remove("btq-hidden");
            };

            prevBtn.addEventListener("click", function () {
              if (submitted || index <= 0) return;
              index--;
              renderQuestion();
              startTimer();
            });

            nextBtn.addEventListener("click", function () {
              if (submitted || index >= questions.length - 1) return;
              index++;
              renderQuestion();
              startTimer();
            });

            submitBtn.addEventListener("click", function () {
              if (submitted) return;
              var unanswered = questions.length - countAnswered();
              if (unanswered > 0 && !window.confirm(unanswered + "টি প্রশ্নের উত্তর দেওয়া হয়নি। জমা দেবেন?")) {
                return;
              }
              finishQuiz(false);
            });

            result.querySelector("button:first-of-type").addEventListener("click", function () {
              if (reviewArea.classList.contains("btq-hidden")) {
                reviewArea.replaceChildren();
                questions.forEach(function (q, i) {
                  var card = document.createElement("div");
                  card.className = "p-3 border rounded-xl bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-xs";
                  card.innerHTML = "<strong>" + (i + 1) + ". " + q.question + "</strong>";
                  q.options.forEach(function (opt, j) {
                    var l = document.createElement("div");
                    l.className = "mt-1.5 p-2 rounded-lg";
                    l.textContent = letters[j] + ". " + opt;
                    if (j === q.answer) {
                      l.className += " bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 font-semibold";
                      l.textContent += " (সঠিক)";
                    } else if (answers[i] === j) {
                      l.className += " bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300";
                      l.textContent += " (আপনার উত্তর)";
                    }
                    card.appendChild(l);
                  });
                  reviewArea.appendChild(card);
                });
                reviewArea.classList.remove("btq-hidden");
                this.textContent = "উত্তর লুকান";
              } else {
                reviewArea.classList.add("btq-hidden");
                this.textContent = "উত্তরগুলো দেখুন";
              }
            });

            $(".btq-restart").addEventListener("click", function () {
              switchQuizSet(currentSetKey);
            });

            renderTime();
            renderQuestion();
          })();
          </script>
        </div>
    </main>
