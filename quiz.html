      background: #f7faf7;

    var letters = ["ক", "খ", "গ", "ঘ"];
    var duration = parseInt(root.getAttribute("data-duration"), 10);
    if (!Number.isFinite(duration) || duration < 1) duration = 15;
    duration = Math.min(duration, 180);

    var index = 0;
    var answers = new Array(questions.length).fill(null);
    var seconds = duration * 60;
    var timer = null;
    var submitted = false;
    var started = false;

    var $ = function (selector) {
      return root.querySelector(selector);
    };

    var play = $(".btq-play");
    var result = $(".btq-result");
    var reviewArea = $(".btq-review-area");
    var timeDisplay = $(".btq-time");
    var timerBox = $(".btq-timer");
    var questionBox = $(".btq-question");
    var optionsBox = $(".btq-options");
    var prevBtn = $(".btq-prev");
    var nextBtn = $(".btq-next");
    var submitBtn = $(".btq-submit");
    var progress = $(".btq-progress");
    var progressFill = $(".btq-progress-fill");

    function renderTime() {
      var m = Math.floor(seconds / 60);
      var s = seconds % 60;
      timeDisplay.textContent =
        String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      timerBox.classList.toggle("btq-warning", seconds <= 60);
    }

    function countAnswered() {
      return answers.filter(function (v) { return v !== null; }).length;
    }

    function renderQuestion() {
      var q = questions[index];
      $(".btq-count").textContent =
        "প্রশ্ন " + (index + 1) + " / " + questions.length;
      $(".btq-answered").textContent = "উত্তর: " + countAnswered();
      questionBox.textContent = q.question;
      optionsBox.replaceChildren();

      q.options.forEach(function (option, i) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "btq-option";
        button.setAttribute("aria-pressed", String(answers[index] === i));
        if (answers[index] === i) button.classList.add("btq-selected");

        var letter = document.createElement("span");
        letter.className = "btq-letter";
        letter.textContent = letters[i] || String(i + 1);

        var text = document.createElement("span");
        text.textContent = option;

        button.append(letter, text);
        button.addEventListener("click", function () {
          if (submitted) return;
          answers[index] = i;
          renderQuestion();
          startTimer();
        });
        optionsBox.appendChild(button);
      });

      prevBtn.disabled = index === 0;
      nextBtn.classList.toggle("btq-hidden", index === questions.length - 1);
      submitBtn.classList.toggle("btq-hidden", index !== questions.length - 1);

      progressFill.style.width =
        (((index + 1) / questions.length) * 100) + "%";
      progress.setAttribute(
        "aria-valuenow",
        String(Math.round(((index + 1) / questions.length) * 100))
      );
    }

    function startTimer() {
      if (started || submitted) return;
      started = true;
      timer = setInterval(function () {
        seconds--;
        renderTime();
        if (seconds <= 0) {
          seconds = 0;
          renderTime();
          finishQuiz(true);
        }
      }, 1000);
    }

    function finishQuiz(timeUp) {
      if (submitted) return;
      submitted = true;
      if (timer !== null) clearInterval(timer);
      if (timeUp) seconds = 0;
      renderTime();

      var correct = 0;
      var wrong = 0;
      var unanswered = 0;

      questions.forEach(function (q, i) {
        if (answers[i] === null) unanswered++;
        else if (answers[i] === q.answer) correct++;
        else wrong++;
      });

      $(".btq-score").textContent = correct + " / " + questions.length;
      $(".btq-correct").textContent = correct;
      $(".btq-wrong").textContent = wrong;
      $(".btq-unanswered").textContent = unanswered;
      $(".btq-message").textContent =
        (timeUp ? "সময় শেষ হয়েছে। " : "পরীক্ষা জমা হয়েছে। ") +
        "আপনি " + questions.length + "টি প্রশ্নের মধ্যে " +
        correct + "টির সঠিক উত্তর দিয়েছেন।";

      play.classList.add("btq-hidden");
      result.classList.remove("btq-hidden");
      reviewArea.classList.add("btq-hidden");
      $(".btq-review").textContent = "উত্তরগুলো দেখুন";
      result.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    prevBtn.addEventListener("click", function () {
      if (submitted || index <= 0) return;
      index--;
      renderQuestion();
      startTimer();
    });

    nextBtn.addEventListener("click", function () {
      if (submitted || index >= questions.length - 1) return;
      index++;
      renderQuestion();
      startTimer();
    });

    submitBtn.addEventListener("click", function () {
      if (submitted) return;
      var unanswered = questions.length - countAnswered();
      if (unanswered > 0 &&
          !window.confirm(unanswered + "টি প্রশ্নের উত্তর দেওয়া হয়নি। পরীক্ষা জমা দেবেন?")) {
        return;
      }
      finishQuiz(false);
    });

    $(".btq-review").addEventListener("click", function () {
      if (reviewArea.classList.contains("btq-hidden")) {
        reviewArea.replaceChildren();
        questions.forEach(function (q, i) {
          var card = document.createElement("div");
          card.style.cssText =
            "border:1px solid #e0e7e2;border-radius:10px;padding:12px;margin-bottom:10px";

          var heading = document.createElement("strong");
          heading.textContent = (i + 1) + ". " + q.question;
          card.appendChild(heading);

          q.options.forEach(function (option, j) {
            var line = document.createElement("div");
            line.style.cssText = "margin-top:6px;padding:5px 7px;border-radius:6px";
            line.textContent = letters[j] + ". " + option;

            if (j === q.answer) {
              line.style.background = "#e4f5e8";
              line.style.color = "#176437";
              line.textContent += " — সঠিক উত্তর";
            } else if (answers[i] === j) {
              line.style.background = "#fff0ed";
              line.style.color = "#b42318";
              line.textContent += " — আপনার উত্তর";
            }
            card.appendChild(line);
          });

          if (answers[i] === null) {
            var note = document.createElement("p");
            note.textContent = "আপনি এই প্রশ্নের উত্তর দেননি।";
            card.appendChild(note);
          }
          reviewArea.appendChild(card);
        });

        reviewArea.classList.remove("btq-hidden");
        $(".btq-review").textContent = "উত্তর লুকান";
      } else {
        reviewArea.classList.add("btq-hidden");
        $(".btq-review").textContent = "উত্তরগুলো দেখুন";
      }
    });

    $(".btq-restart").addEventListener("click", function () {
      if (timer !== null) clearInterval(timer);
      index = 0;
      answers = new Array(questions.length).fill(null);
      seconds = duration * 60;
      submitted = false;
      started = false;
      timer = null;
      renderTime();
      renderQuestion();
      reviewArea.replaceChildren();
      reviewArea.classList.add("btq-hidden");
      result.classList.add("btq-hidden");
      play.classList.remove("btq-hidden");
    });

    if (!questions.length || questions.some(function (q) {
      return !q.question || !Array.isArray(q.options) ||
        q.options.length < 2 || !Number.isInteger(q.answer) ||
        q.answer < 0 || q.answer >= q.options.length;
    })) {
      play.textContent = "কুইজের প্রশ্ন বা উত্তর সেটিংসে ভুল আছে।";
      return;
    }

    renderTime();
    renderQuestion();
  })();
  </script>
  </div>
